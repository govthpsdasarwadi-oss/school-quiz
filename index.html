<script>
// Password
const QUIZ_PASSWORD = "8151004545";
function checkPassword(){
    const pw = document.getElementById("quiz-password").value;
    if(pw === QUIZ_PASSWORD){
        document.getElementById("password-screen").style.display="none";
        document.getElementById("main-content").style.display="block";
        loadQuestion();
    } else {
        document.getElementById("pw-error").innerText = "Incorrect password!";
    }
}

// Quiz logic
const quizData = [
        {q: "ಭಾರತದ ರಾಷ್ಟ್ರಪತಿ ಯಾರು?",o: ["ನರೇಂದ್ರ ಮೋದಿ", "ದ್ರೌಪದಿ ಮುರ್ಮು", "ಅಮಿತ್ ಶಾ", "ರಾಮನಾಥ್ ಕೋವಿಂದ್"], a: "ದ್ರೌಪದಿ ಮುರ್ಮು"},
        {q: "ಕರ್ನಾಟಕದ ರಾಜಧಾನಿ ಯಾವುದು?", o: ["ಮೈಸೂರು", "ಬೆಂಗಳೂರು", "ಹುಬ್ಬಳ್ಳಿ", "ಧಾರವಾಡ"], a: "ಬೆಂಗಳೂರು"},
        {q: "ಕನ್ನಡ ಸಾಹಿತ್ಯದ 'ಆದಿಕವಿ' ಯಾರು?", o: ["ರನ್ನ", "ಪಂಪ", "ಪೊನ್ನ", "ಕುಮಾರವ್ಯಾಸ"], a: "ಪಂಪ"},
        {q: "ಭೂಮಿಯ ಮೇಲೆ ಅತಿ ದೊಡ್ಡ ಖಂಡ ಯಾವುದು?", o: ["ಏಷ್ಯಾ", "ಆಫ್ರಿಕಾ", "ಯುರೋಪ್", "ಅಮೆರಿಕಾ"], a: "ಏಷ್ಯಾ"},
        {q: "ಮನುಷ್ಯನ ದೇಹದಲ್ಲಿ ಎಷ್ಟು ಮೂಳೆಗಳಿವೆ?", o: ["200", "206", "210", "208"], a: "206"},
        {q: "ವಿಶ್ವದ ಅತಿ ಎತ್ತರದ ಶಿಖರ ಯಾವುದು?", o: ["ಕೆ2", "ಕಾಂಚನಜುಂಗಾ", "ಮೌಂಟ್ ಎವರೆಸ್ಟ್", "ಆನೈಮುಡಿ"], a: "ಮೌಂಟ್ ಎವರೆಸ್ಟ್"},
        {q: "ಶೂನ್ಯವನ್ನು ಕಂಡುಹಿಡಿದವರು ಯಾರು?", o: ["ನ್ಯೂಟನ್", "ಆರ್ಯಭಟ", "ಗೆಲಿಲಿಯೋ", "ಐನ್ಸ್ಟೈನ್"], a: "ಆರ್ಯಭಟ"},
        {q: "ಕರ್ನಾಟಕದ 'ಉದ್ಯಾನ ನಗರಿ' ಯಾವುದು?", o: ["ಮೈಸೂರು", "ಬೆಂಗಳೂರು", "ಮಡಿಕೇರಿ", "ಶಿವಮೊಗ್ಗ"], a: "ಬೆಂಗಳೂರು"},
        {q: "ಸೂರ್ಯನ ಬೆಳಕಿನಿಂದ ಸಿಗುವ ವಿಟಮಿನ್ ಯಾವುದು?", o: ["ವಿಟಮಿನ್ ಎ", "ವಿಟಮಿನ್ ಸಿ", "ವಿಟಮಿನ್ ಡಿ", "ವಿಟಮಿನ್ ಬಿ"], a: "ವಿಟಮಿನ್ ಡಿ"},
        {q: "ಕ್ರಿಕೆಟ್ ಆಟದಲ್ಲಿ ಒಂದು ತಂಡದಲ್ಲಿ ಎಷ್ಟು ಮಂದಿ ಇರುತ್ತಾರೆ?", o: ["10", "11", "12", "9"], a: "11"},
        {q: "ಭಾರತದ ರಾಷ್ಟ್ರೀಯ ಪ್ರಾಣಿ ಯಾವುದು?", o: ["ಸಿಂಹ", "ಹುಲಿ", "ಆನೆ", "ಚಿರತೆ"], a: "ಹುಲಿ"},
        {q: "ಗಾಂಧೀಜಿಯವರ ಜನ್ಮಸ್ಥಳ ಯಾವುದು?", o: ["ಪೋರಬಂದರ್", "ಅಹಮದಾಬಾದ್", "ರಾಜಕೋಟ್", "ಸೂರತ್"], a: "ಪೋರಬಂದರ್"},
        {q: "ಕರ್ನಾಟಕದ ಹಿರಿಯ ಗಾಂಧಿ ಎಂದು ಯಾರನ್ನು ಕರೆಯುತ್ತಾರೆ?", o: ["ಹಾರ್ದೇಕರ್ ಮಂಜಪ್ಪ", "ಬಸವಣ್ಣ", "ಕುವೆಂಪು", "ದ.ರಾ. ಬೇಂದ್ರೆ"], a: "ಹಾರ್ದೇಕರ್ ಮಂಜಪ್ಪ"},
        {q: "ವಿಶ್ವ ಪರಿಸರ ದಿನ ಯಾವಾಗ?", o: ["ಜೂನ್ 5", "ಮೇ 1", "ಆಗಸ್ಟ್ 15", "ಜನವರಿ 26"], a: "ಜೂನ್ 5"},
        {q: "ದೂರದರ್ಶನವನ್ನು (TV) ಕಂಡುಹಿಡಿದವರು ಯಾರು?", o: ["ಗ್ರಹಾಂ ಬೆಲ್", "ಜಾನ್ ಲೋಗಿ ಬೆಯರ್ಡ್", "ಎಡಿಸನ್", "ನ್ಯೂಟನ್"], a: "ಜಾನ್ ಲೋಗಿ ಬೆಯರ್ಡ್"},
        {q: "ಭಾರತದ ರಾಷ್ಟ್ರೀಯ ಹೂವು ಯಾವುದು?", o: ["ಗುಲಾಬಿ", "ಕಮಲ", "ಸೂರ್ಯಕಾಂತಿ", "ಮಲ್ಲಿಗೆ"], a: "ಕಮಲ"},
        {q: "ಕುವೆಂಪು ಅವರಿಗೆ ಜ್ಞಾನಪೀಠ ತಂದುಕೊಟ್ಟ ಕೃತಿ?", o: ["ಮಲೆಗಳಲ್ಲಿ ಮದುಮಗಳು", "ಶ್ರೀ ರಾಮಾಯಣ ದರ್ಶನಂ", "ಕಾನೂರು ಹೆಗ್ಗಡಿತಿ", "ಪಕ್ಷಿಕಾಶಿ"], a: "ಶ್ರೀ ರಾಮಾಯಣ ದರ್ಶನಂ"},
        {q: "ನಮ್ಮ ದೇಶದ ರಾಷ್ಟ್ರಗೀತೆ ಬರೆದವರು ಯಾರು?", o: ["ಬಂಕಿಮಚಂದ್ರ", "ರವೀಂದ್ರನಾಥ ಟ್ಯಾಗೋರ್", "ಕುವೆಂಪು", "ಬೇಂದ್ರೆ"], a: "ರವೀಂದ್ರನಾಥ ಟ್ಯಾಗೋರ್"},
        {q: "ರಾಮಾಯಣದಲ್ಲಿ ಲಕ್ಷ್ಮಣನ ತಾಯಿ ಯಾರು?", o: ["ಕೌಸಲ್ಯ", "ಕೈಕೇಯಿ", "ಸುಮಿತ್ರೆ", "ಮಂಡೋದರಿ"], a: "ಸುಮಿತ್ರೆ"},
        {q: "ಒಂದು ಕಿಲೋ ಮೀಟರ್ ಎಂದರೆ ಎಷ್ಟು ಮೀಟರ್?", o: ["100", "1000", "500", "1500"], a: "1000"},
        {q: "ಭಾರತದ ಮೊದಲ ಪ್ರಧಾನಿ ಯಾರು?", o: ["ಇಂದಿರಾ ಗಾಂಧಿ", "ಜವಾಹರಲಾಲ್ ನೆಹರು", "ಶಾಸ್ತ್ರಿ", "ವಾಜಪೇಯಿ"], a: "ಜವಾಹರಲಾಲ್ ನೆಹರು"},
        {q: "ಜೋಗ ಜಲಪಾತ ಯಾವ ನದಿಯಿಂದ ಉಂಟಾಗಿದೆ?", o: ["ಕಾವೇರಿ", "ಶರಾವತಿ", "ತುಂಗಭದ್ರಾ", "ಕೃಷ್ಣಾ"], a: "ಶರಾವತಿ"},
        {q: "ವಿಶ್ವದ ಅತಿ ದೊಡ್ಡ ಸಾಗರ ಯಾವುದು?", o: ["ಹಿಂದೂ", "ಅಟ್ಲಾಂಟಿಕ್", "ಪೆಸಿಫಿಕ್", "ಆರ್ಕ್ಟಿಕ್"], a: "ಪೆಸಿಫಿಕ್"},
        {q: "ಕಂಪ್ಯೂಟರ್ ಪಿತಾಮಹ ಯಾರು?", o: ["ಚಾರ್ಲ್ಸ್ ಬ್ಯಾಬೇಜ್", "ಬಿಲ್ ಗೇಟ್ಸ್", "ಸ್ಟೀವ್ ಜಾಬ್ಸ್", "ನ್ಯೂಟನ್"], a: "ಚಾರ್ಲ್ಸ್ ಬ್ಯಾಬೇಜ್"},
        {q: "ಕರ್ನಾಟಕದ ರಾಜ್ಯ ಪಕ್ಷಿ ಯಾವುದು?", o: ["ನವಿಲು", "ನೀಲಕಂಠ", "ಗಿಳಿ", "ಕೋಗಿಲೆ"], a: "ನೀಲಕಂಠ"},
        {q: "ಸಂವಿಧಾನ ದಿನವನ್ನು ಯಾವಾಗ ಆಚರಿಸಲಾಗುತ್ತದೆ?", o: ["ಆಗಸ್ಟ್ 15", "ನವೆಂಬರ್ 26", "ಜನವರಿ 26", "ಅಕ್ಟೋಬರ್ 2"], a: "ನವೆಂಬರ್ 26"},
        {q: "ವಂದೇ ಮಾತರಂ ಬರೆದವರು ಯಾರು?", o: ["ಟ್ಯಾಗೋರ್", "ಬಂಕಿಮಚಂದ್ರ ಚಟರ್ಜಿ", "ಸರೋಜಿನಿ ನಾಯ್ಡು", "ತಿಲಕ್"], a: "ಬಂಕಿಮಚಂದ್ರ ಚಟರ್ಜಿ"},
        {q: "ರಕ್ತ ಹೆಪ್ಪುಗಟ್ಟಲು ಸಹಾಯ ಮಾಡುವ ವಿಟಮಿನ್?", o: ["ವಿಟಮಿನ್ ಎ", "ವಿಟಮಿನ್ ಬಿ", "ವಿಟಮಿನ್ ಕೆ", "ವಿಟಮಿನ್ ಸಿ"], a: "ವಿಟಮಿನ್ ಕೆ"},
        {q: "ಸೌರಮಂಡಲದ ಅತ್ಯಂತ ಬಿಸಿಯಾದ ಗ್ರಹ ಯಾವುದು?", o: ["ಬುಧ", "ಶುಕ್ರ", "ಮಂಗಳ", "ಗುರು"], a: "ಶುಕ್ರ"},
        {q: "ಅಂತರಾಷ್ಟ್ರೀಯ ಯೋಗ ದಿನ ಎಂದು?", o: ["ಜೂನ್ 21", "ಜೂನ್ 5", "ಮೇ 10", "ಆಗಸ್ಟ್ 1"], a: "ಜೂನ್ 21"},

        {q: "ಒಂದು ಬೈಟ್ (Byte) ಎಂದರೆ ಎಷ್ಟು ಬಿಟ್ಗಳು?", o: ["4", "8", "16", "32"], a: "8"}
    ];
let currentIdx=0,boysScore=0,girlsScore=0,celebrationInterval;

function loadQuestion(){
    if(currentIdx>=quizData.length){ showResults(); return; }
    document.getElementById("q-counter").innerText=`Question: ${currentIdx+1} / ${quizData.length}`;
    const q=quizData[currentIdx];
    const isBoysTurn = currentIdx%2===0;
    const turn = document.getElementById("teamTurn");
    turn.innerText = isBoysTurn ? "👦 Boys Turn" : "👧 Girls Turn";
    turn.style.background = isBoysTurn ? "#007bff" : "#e91e63";
    document.getElementById("quiz").innerHTML=`<div class="question">${q.q}</div><div class="options">${q.o.map(opt=>`<button onclick="checkAnswer(this,'${opt}')">${opt}</button>`).join('')}</div>`;
    document.getElementById("feedback").innerText="";
}

function checkAnswer(btn,selected){
    const q=quizData[currentIdx];
    const isBoysTurn=currentIdx%2===0;
    const allBtns=document.querySelectorAll(".options button");
    allBtns.forEach(b=>b.disabled=true);
    if(selected===q.a){ btn.classList.add("correct-ans"); if(isBoysTurn) boysScore++; else girlsScore++; document.getElementById("feedback").innerText="ಸರಿಯಾದ ಉತ್ತರ! ✔"; document.getElementById("feedback").style.color="#00ffcc"; }
    else{ btn.classList.add("wrong-ans"); allBtns.forEach(b=>{ if(b.innerText===q.a) b.classList.add("correct-ans"); }); document.getElementById("feedback").innerText="ತಪ್ಪು ಉತ್ತರ! ✖"; document.getElementById("feedback").style.color="#ff4d4d"; }
    document.getElementById("boysScore").innerText=boysScore;
    document.getElementById("girlsScore").innerText=girlsScore;
    currentIdx++;
    setTimeout(loadQuestion,2000);
}

function showResults(){
    document.getElementById("quiz-ui").style.display="none";
    document.getElementById("final-screen").style.display="block";
    let win = boysScore>girlsScore?"👦BOYS WIN🏆":(girlsScore>boysScore?"👧GIRLS WIN🏆":"TIE! 🤝");
    document.getElementById("winner-text").innerText=win;
    document.getElementById("total-score-text").innerText=`Boys: ${boysScore} | Girls: ${girlsScore}`;
    startContinuousCelebration();
}

function resetQuizData(){
    if(confirm("ಮೊದಲಿನಿಂದ ಪ್ರಾರಂಭಿಸಬೇಕೆ?")){
        currentIdx=0; boysScore=0; girlsScore=0;
        document.getElementById("boysScore").innerText="0";
        document.getElementById("girlsScore").innerText="0";
        document.getElementById("final-screen").style.display="none";
        document.getElementById("quiz-ui").style.display="block";
        document.getElementById("fireworks-container").innerHTML="";
        clearInterval(celebrationInterval);
        loadQuestion();
    }
}

// Fireworks
function explodeFirework(container){
    const centerX = Math.random()*window.innerWidth;
    const centerY = Math.random()*window.innerHeight*0.7;
    const colors=["#ff0","#f00","#0ff","#0f0","#f0f","#ff5722","#ff69b4"];
    const fwSound = document.getElementById("fw-sound");
    for(let i=0;i<40;i++){
        const f=document.createElement("div");
        f.className="firework";
        f.style.left=centerX+"px"; f.style.top=centerY+"px";
        const angle=Math.random()*2*Math.PI;
        const dist=Math.random()*300+50;
        const color=colors[Math.floor(Math.random()*colors.length)];
        f.style.backgroundColor=color; f.style.width=f.style.height=Math.random()*12+5+"px";
        container.appendChild(f);
        const vx=Math.cos(angle)*dist;
        const vy=Math.sin(angle)*dist;
        f.animate([{transform:"translate(0,0)", opacity:1},{transform:`translate(${vx}px,${vy}px)`, opacity:0}],{duration:1200, easing:"ease-out"});
        setTimeout(()=>f.remove(),1300);
    }
    fwSound.currentTime=0; fwSound.play();
}

function startContinuousCelebration(){
    const container=document.getElementById("fireworks-container");
    celebrationInterval=setInterval(()=>{ explodeFirework(container); },500);
}
document.addEventListener("contextmenu", function (e) {
    e.preventDefault();

    alert("⚠️ Right-click is disabled!🙏");
  });
window.onload = loadQuestion;
</script>
